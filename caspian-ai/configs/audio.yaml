# Акустический детектор браконьерства: мотор / выстрел / авиация / бензопила / фон
sample_rate: 16000
clip_seconds: 2.0          # длина окна, на котором учится и работает модель
# aircraft и chainsaw выделены из "трудных негативов": раньше они давали
# основную массу ложных тревог по мотору, теперь это отдельные классы.
classes: [background, boat_motor, gunshot, aircraft, chainsaw]
background_class: background

features:
  n_fft: 1024              # 64 мс, разрешение ~15.6 Гц — важно для низких гармоник мотора
  hop_length: 160          # 10 мс
  n_mels: 64
  fmin: 20
  fmax: 8000

model:
  channels: [32, 64, 128, 256]
  dropout: 0.3
  specaugment: true

data:
  raw_dir: data/raw
  processed_dir: data/processed
  manifest: data/manifest.csv
  val_fraction: 0.15
  test_fraction: 0.15
  # Аугментация: событие накладывается на фон с разным SNR (имитация расстояния до буя)
  mix_prob: 0.7
  snr_db: [-10, 20]
  gain_db: [-6, 6]

train:
  epochs: 40
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  patience: 20             # early stopping по macro-F1; большой запас из-за OneCycle-расписания
  seed: 42
  num_workers: 0
  out_dir: runs/audio

inference:
  window_seconds: 2.0
  hop_seconds: 0.5
  thresholds:              # порог вероятности для алерта
    boat_motor: 0.6
    gunshot: 0.5
    chainsaw: 0.9          # возможная незаконная рубка; порог из `cli tune` (precision=1.0 на вал.)
    aircraft: 0.9          # информационный алерт, не тревога; порог из `cli tune`
  min_consecutive:         # сколько окон подряд нужно для алерта
    boat_motor: 3          # мотор — продолжительный звук, отсекаем случайные срабатывания
    gunshot: 1             # выстрел — импульс, достаточно одного окна
    chainsaw: 3
    aircraft: 4
  severity:
    boat_motor: medium
    gunshot: high
    chainsaw: high
    aircraft: info
    unknown_sound: low
  labels_ru:
    boat_motor: "Шум лодочного мотора"
    gunshot: "Выстрел"
    chainsaw: "Бензопила (возможная рубка)"
    aircraft: "Авиация (вертолёт/самолёт)"
    unknown_sound: "Неизвестный звук — требуется проверка"
  # OOD-детектор "не знаю": окно считается незнакомым, если его эмбеддинг
  # далёк от всех классов обучения (см. ood.py). Файл создаёт `cli ood`.
  ood:
    enabled: true
    min_consecutive: 2
  # КАСКАД: буй — "параноидальная растяжка" (низкие пороги, высокий recall,
  # алерт стоит 1 КБ), сервер перепроверяет клип стандартными порогами выше.
  # edge.py применяет эти оверрайды поверх thresholds.
  edge_thresholds:
    boat_motor: 0.40
    gunshot: 0.35
    chainsaw: 0.50
    aircraft: 0.80
